<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECE8E1; --panel:#FFFFFF; --ink:#181512; --muted:#5A534A; --line:#D9D2C4;
    --accent:#2F6F62; --accent-bg:#DCEAE6;
    --pago:#2F6F62; --pago-bg:#DCEAE6;
    --retiro:#9C4A3D; --retiro-bg:#F1DED8;
    --sinpago:#6A5590; --sinpago-bg:#E8E1F0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1720; --panel:#17222D; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2B3A47;
      --accent:#4CAF7D; --accent-bg:#123425;
      --pago:#4CAF7D; --pago-bg:#123425;
      --retiro:#E8746D; --retiro-bg:#3A1917;
      --sinpago:#A78BFA; --sinpago-bg:#2C2350;
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;
    padding:20px 14px 60px;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  .brand{ text-align:center; margin-bottom:22px; }
  .brand .shield{ font-size:34px; }
  .brand h1{ font-size:17px; margin:4px 0 0; letter-spacing:.02em; }
  .brand p{ font-size:12.5px; color:var(--muted); margin:2px 0 0; }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(15,30,45,.06);
  }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:12px 0 4px; }
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font-size:14px;
  }
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-weight:600;
    padding:11px 16px; font-size:14px;
  }
  .btn-primary{ background:var(--accent); color:#fff; width:100%; margin-top:18px; }
  .btn-primary:disabled{ opacity:.6; cursor:default; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  #loginErr{ color:var(--retiro); font-size:12.5px; margin-top:10px; min-height:1px; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .top-row .quien{ font-size:14px; font-weight:700; }
  .top-row .ced{ font-size:12px; color:var(--muted); }
  .resumen-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .resumen-row:last-child{ border-bottom:none; }
  .resumen-row .v{ font-variant-numeric:tabular-nums; font-weight:700; }
  .v.pendiente{ color:var(--sinpago); }
  .v.aldia{ color:var(--pago); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px; }
  th{
    text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); padding:7px 6px; border-bottom:2px solid var(--line); white-space:nowrap;
  }
  td{ padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.num{ font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  .estado{ font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  .estado.PAGO, .estado.PAGO_CONDUCTOR{ background:var(--pago-bg); color:var(--pago); }
  .estado.RETIRO{ background:var(--retiro-bg); color:var(--retiro); }
  .estado:not(.PAGO):not(.PAGO_CONDUCTOR):not(.RETIRO){ background:var(--sinpago-bg); color:var(--sinpago); }
  .doc-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .doc-row:last-child{ border-bottom:none; }
  .doc-row .nombre{ display:flex; align-items:center; gap:8px; }
  .doc-row a{
    background:var(--accent-bg); color:var(--accent); text-decoration:none;
    padding:6px 12px; border-radius:7px; font-size:12.5px; font-weight:700;
  }
  .doc-acciones{ display:flex; gap:8px; flex-shrink:0; }
  .doc-fecha{ display:block; font-size:11.5px; color:var(--muted); font-weight:400; margin-top:2px; }
  .vacio{ color:var(--muted); font-size:13px; text-align:center; padding:14px 0; }
  h2{ font-size:13.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:0 0 10px; }
  .table-wrap{ overflow-x:auto; }
  #appScreen{ display:none; }
</style>

<script>
const SUPABASE_URL = "https://jjygarfwdmhzspqonvql.supabase.co";
const SUPABASE_KEY = "sb_publishable_QbM9pAw14n8SAu1aZr85-w_malVTs1s";
const SESSION_KEY = "prosegurosnet_portal_sesion";

// El portal habla directo con Supabase usando fetch (incluido en todos los navegadores),
// sin descargar ninguna librería externa: así carga al instante en cualquier red o celular,
// aunque los servidores de librerías (jsdelivr, unpkg) estén bloqueados o lentos.

let sesion = null; // { access_token, refresh_token, expires_at (segundos), cedula }

function leerSesionGuardada(){
  try{ const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); return s && s.refresh_token ? s : null; }
  catch(e){ return null; }
}
function guardarSesion(s){
  sesion = s;
  try{ if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){}
}

// fetch con límite de tiempo: si el servidor no responde, se corta y se avisa en vez de quedarse "cargando".
async function pedir(url, opciones = {}, segundos = 15){
  const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const t = setTimeout(() => ctrl && ctrl.abort(), segundos * 1000);
  try{
    const r = await fetch(url, Object.assign({}, opciones, ctrl ? { signal: ctrl.signal } : {}));
    let cuerpo = null;
    try{ cuerpo = await r.json(); }catch(e){}
    return { ok: r.ok, status: r.status, cuerpo };
  }catch(e){
    throw new Error(e && e.name === "AbortError" ? "el servidor tardó demasiado" : "sin conexión");
  }finally{ clearTimeout(t); }
}

function aSesion(cuerpo, cedula){
  const ahora = Math.floor(Date.now() / 1000);
  return {
    access_token: cuerpo.access_token,
    refresh_token: cuerpo.refresh_token,
    expires_at: cuerpo.expires_at || (ahora + (cuerpo.expires_in || 3600)),
    cedula,
  };
}

async function iniciarSesion(cedula, password){
  const email = `cliente.${cedula}@portal.prosegurosnet.com`;
  const r = await pedir(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  if (!r.ok || !r.cuerpo || !r.cuerpo.access_token) return false;
  guardarSesion(aSesion(r.cuerpo, cedula));
  return true;
}

async function renovarSesion(){
  if (!sesion || !sesion.refresh_token) return false;
  // Si otra pestaña (o una recarga) ya renovó la sesión, se usa esa en vez de gastar otra vez el permiso.
  const guardada = leerSesionGuardada();
  if (guardada && guardada.refresh_token !== sesion.refresh_token && guardada.expires_at - Math.floor(Date.now() / 1000) > 60){
    sesion = guardada;
    return true;
  }
  const r = await pedir(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: sesion.refresh_token }),
  });
  if (!r.ok || !r.cuerpo || !r.cuerpo.access_token){
    const otra = leerSesionGuardada();
    if (otra && otra.refresh_token !== sesion.refresh_token){ sesion = otra; return true; }
    guardarSesion(null); return false;
  }
  guardarSesion(aSesion(r.cuerpo, sesion.cedula));
  return true;
}

async function tokenVigente(){
  if (!sesion) return null;
  const ahora = Math.floor(Date.now() / 1000);
  if (!sesion.access_token || sesion.expires_at - ahora < 60){
    if (!(await renovarSesion())) return null;
  }
  return sesion.access_token;
}

// Consulta autenticada a la base de datos (si el token venció en el camino, lo renueva y reintenta una vez).
async function consultar(ruta, opciones = {}){
  for (let intento = 0; intento < 2; intento++){
    const token = await tokenVigente();
    if (!token) return { ok: false, status: 401, cuerpo: null };
    const r = await pedir(`${SUPABASE_URL}${ruta}`, Object.assign({}, opciones, {
      headers: Object.assign({ "apikey": SUPABASE_KEY, "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }, opciones.headers || {}),
    }));
    if (r.status === 401 && intento === 0){
      if (!(await renovarSesion())) return r;
      continue;
    }
    return r;
  }
}

async function cerrarSesion(){
  const token = sesion && sesion.access_token;
  guardarSesion(null);
  if (token){
    try{ await pedir(`${SUPABASE_URL}/auth/v1/logout`, { method: "POST", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${token}` } }, 5); }catch(e){}
  }
}

function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto",
               "Septiembre","Octubre","Noviembre","Diciembre"];
const COSTO_AFILIACION = 149000;
const COSTO_MENSUAL = 75000;
const fmt = (n) => {
  const num = Number(n);
  if (n === "" || n === null || n === undefined || isNaN(num)) return "$0";
  return "$" + num.toLocaleString("es-CO", { maximumFractionDigits: 0 });
};
const numOrZero = (n) => { const v = Number(n); return isNaN(v) ? 0 : v; };
const estadoClass = (estado) => (estado || "SIN_ESTADO").replace(/\s+/g, "_").toUpperCase();

const TIPO_LABEL = {
  cedula: "Cédula", eps: "EPS", afp: "Fondo de pensión", caja: "Caja de compensación",
  arl: "ARL", planilla_pagada: "Planilla pagada", comprobante_pago: "Comprobante de pago planilla",
  licencia: "Licencia de conducción", soat_tecno: "SOAT y tecnomecánica", poliza: "Póliza del vehículo",
};

function calcProrrateo(row, mesActual){
  const fecha = String(row.fecha_ingreso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); // fecha_ingreso viene en formato YYYY-MM-DD de Supabase
  const mes = String(mesActual || "").match(/^(\S+)\s+de\s+(\d{4})$/);
  if (!fecha || !mes) return { factor: 1 };
  const diaIngreso = parseInt(fecha[3], 10);
  const mesIngreso = parseInt(fecha[2], 10) - 1;
  const anioIngreso = parseInt(fecha[1], 10);
  const mesActualIdx = MESES.indexOf(mes[1]);
  const anioActual = parseInt(mes[2], 10);
  if (mesIngreso !== mesActualIdx || anioIngreso !== anioActual) return { factor: 1 };
  const dias = Math.max(0, 30 - diaIngreso + 1);
  return { factor: dias / 30 };
}
function factorDiasProporcionales(row){
  if (estadoClass(row.estado_tramite) !== "DIAS_PROPORCIONALES") return 1;
  const diaIngreso = parseInt(String(row.fecha_ingreso || "").split("-")[2], 10);
  if (!isNaN(diaIngreso) && diaIngreso >= 1 && diaIngreso <= 30) return Math.max(0, 30 - diaIngreso + 1) / 30;
  return 1;
}
function calcularTotalPagar(row, mesNombre){
  const prorr = calcProrrateo(row, mesNombre);
  const esAfiliacion = estadoClass(row.estado_tramite) === "AFILIACION";
  const esDiasProp = estadoClass(row.estado_tramite) === "DIAS_PROPORCIONALES";
  const factorAportes = prorr.factor !== 1 ? prorr.factor : factorDiasProporcionales(row);
  const sinPension = row.estado_afp === "Pensionado" || row.estado_afp === "No Cumple Semanas";
  const valAportes = (campo) => Math.round(numOrZero(row[campo]) * factorAportes);
  const valorPension = sinPension ? 0 : valAportes("valor_pension");
  const recargo = numOrZero(row.recargo_mora); // recargo por mora (después del día 21)
  if (esAfiliacion) return numOrZero(row.costo_servicio) + recargo;
  const costo = (esDiasProp && numOrZero(row.costo_servicio) === COSTO_AFILIACION) ? COSTO_MENSUAL : numOrZero(row.costo_servicio);
  return costo + valAportes("valor_eps") + valAportes("valor_arl") + valorPension + valAportes("valor_caja") + recargo;
}

function mostrarLogin(){
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("appScreen").style.display = "none";
}
function mostrarApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "block";
}

function mostrarErrorDatos(msg){
  document.getElementById("historialCont").innerHTML = `<div class="vacio">${esc(msg)}</div>`;
  document.getElementById("resumenCont").innerHTML = "";
  document.getElementById("docsCont").innerHTML = "";
}

const PORTAL_DESDE = 202610; // año*100 + mes
const MESES_PORTAL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fechaDeMes(nombre){
  const m = String(nombre || "").trim().toLowerCase().match(/^(\S+)\s+de\s+(\d{4})$/);
  if (!m) return 0;
  const i = MESES_PORTAL.indexOf(m[1]);
  return i < 0 ? 0 : Number(m[2]) * 100 + (i + 1);
}

async function cargarDatosCliente(cedula){
  document.getElementById("miCedula").textContent = `Cédula ${cedula}`;
  let r;
  try{
    r = await consultar(`/rest/v1/clients?select=*,months(name,sort_order)&cedula=eq.${encodeURIComponent(cedula)}`);
  }catch(e){
    mostrarErrorDatos("No se pudo conectar con el servidor. Revisa tu internet y vuelve a entrar.");
    return;
  }
  if (r.status === 401){ mostrarLogin(); document.getElementById("loginErr").textContent = "Tu sesión venció. Vuelve a entrar."; return; }
  if (!r.ok || !Array.isArray(r.cuerpo)){ mostrarErrorDatos("No se pudo cargar tu historial. Intenta de nuevo en un momento."); return; }

  // El cliente ve su información desde octubre de 2026 (la base de datos tampoco entrega meses anteriores).
  const filas = r.cuerpo
    .filter(row => row.months && fechaDeMes(row.months.name) >= PORTAL_DESDE)
    .sort((a, b) => fechaDeMes(a.months.name) - fechaDeMes(b.months.name));
  document.getElementById("quienSoy").textContent = filas.length ? (filas[filas.length - 1].nombre || "Cliente") : "Cliente";

  let saldoAcumulado = 0;
  const apariciones = filas.map(row => {
    const mesNombre = row.months ? row.months.name : "";
    const valor = calcularTotalPagar(row, mesNombre);
    const ec = estadoClass(row.estado_tramite);
    if (ec !== "PAGO" && ec !== "PAGO_CONDUCTOR" && ec !== "RETIRO") saldoAcumulado += valor;
    return { mes: mesNombre, estado: row.estado_tramite, planilla: row.no_planilla_pagada, valor, saldo: saldoAcumulado };
  });

  const totalGeneral = apariciones.reduce((acc, a) => acc + a.valor, 0);
  const totalPagado = apariciones.filter(a => ["PAGO","PAGO_CONDUCTOR"].includes(estadoClass(a.estado))).reduce((acc, a) => acc + a.valor, 0);
  const totalPendiente = apariciones.length ? apariciones[apariciones.length - 1].saldo : 0;
  let mesesAtrasados = 0;
  for (let i = apariciones.length - 1; i >= 0; i--){
    const ec = estadoClass(apariciones[i].estado);
    if (ec === "PAGO" || ec === "PAGO_CONDUCTOR" || ec === "RETIRO") break;
    mesesAtrasados++;
  }

  document.getElementById("resumenCont").innerHTML = `
    <div class="resumen-row"><span>Total cobrado (${apariciones.length} mes(es))</span><span class="v">${fmt(totalGeneral)}</span></div>
    <div class="resumen-row"><span>Total pagado</span><span class="v">${fmt(totalPagado)}</span></div>
    <div class="resumen-row"><span>Saldo pendiente actual</span><span class="v ${totalPendiente > 0 ? "pendiente" : "aldia"}">${fmt(totalPendiente)}</span></div>
    ${mesesAtrasados > 0
      ? `<div class="resumen-row"><span>Meses seguidos sin pagar</span><span class="v pendiente">${mesesAtrasados}</span></div>`
      : `<div class="resumen-row"><span>Estado de cuenta</span><span class="v aldia">Al día ✅</span></div>`}
  `;

  document.getElementById("historialCont").innerHTML = apariciones.length ? `
    <table>
      <thead><tr><th>Mes</th><th>Planilla</th><th>Estado</th><th class="num">Valor</th><th class="num">Saldo</th></tr></thead>
      <tbody>
        ${apariciones.map(a => `
          <tr>
            <td>${esc(a.mes)}</td>
            <td>${esc(a.planilla || "—")}</td>
            <td><span class="estado ${estadoClass(a.estado)}">${esc(a.estado === "PAGO CONDUCTOR" ? "PAGO" : (a.estado || "—"))}</span></td>
            <td class="num">${fmt(a.valor)}</td>
            <td class="num ${a.saldo > 0 ? "pendiente" : ""}">${fmt(a.saldo)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  ` : `<div class="vacio">Todavía no hay historial registrado desde octubre de 2026.</div>`;

  await cargarDocumentos(cedula);
}

// Los enlaces de los documentos se preparan ANTES de que el cliente los toque, como
// enlaces normales. (Si se abre primero una pestaña vacía y luego se pide el enlace,
// el iPhone congela el portal al cambiar de pestaña y el documento nunca carga.)
function formatearFechaDoc(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  try{
    return d.toLocaleString("es-CO", { timeZone: "America/Bogota", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit" });
  }catch(e){ return d.toLocaleDateString(); }
}
const EXT_POR_TIPO = { "application/pdf": "pdf", "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/heic": "heic" };
let docsCedulaActual = null, docsPreparadosEn = 0, docsTimer = null;

async function cargarDocumentos(cedula){
  const cont = document.getElementById("docsCont");
  docsCedulaActual = cedula;
  let r;
  try{ r = await consultar(`/rest/v1/documentos?select=tipo,storage_path,uploaded_at&cedula=eq.${encodeURIComponent(cedula)}`); }
  catch(e){ cont.innerHTML = `<div class="vacio">No se pudieron cargar tus documentos. Recarga la página.</div>`; return; }
  const docs = r.ok && Array.isArray(r.cuerpo) ? r.cuerpo : [];
  if (!docs.length){
    cont.innerHTML = `<div class="vacio">Todavía no hay documentos cargados para ti.</div>`;
    return;
  }
  cont.innerHTML = `<div class="vacio">Preparando tus documentos…</div>`;

  // Tipo de archivo de cada documento (para que la descarga tenga la extensión correcta).
  const tipoArchivo = {}, fechaArchivo = {};
  try{
    const l = await consultar(`/storage/v1/object/list/documentos-clientes`, {
      method: "POST", body: JSON.stringify({ prefix: `${cedula}`, limit: 100, offset: 0 }),
    });
    if (l.ok && Array.isArray(l.cuerpo)) l.cuerpo.forEach(o => { if (o && o.name){
      tipoArchivo[`${cedula}/${o.name}`] = o.metadata && o.metadata.mimetype;
      fechaArchivo[`${cedula}/${o.name}`] = o.updated_at || o.created_at;
    } });
  }catch(e){}

  // Enlaces firmados (válidos 1 hora) para todos los documentos de una sola vez.
  let firmados = {};
  try{
    const s = await consultar(`/storage/v1/object/sign/documentos-clientes`, {
      method: "POST", body: JSON.stringify({ expiresIn: 3600, paths: docs.map(d => d.storage_path) }),
    });
    if (s.ok && Array.isArray(s.cuerpo)){
      s.cuerpo.forEach(x => {
        const rel = x && (x.signedURL || x.signedUrl);
        if (rel && !x.error) firmados[x.path] = rel.startsWith("http") ? rel : `${SUPABASE_URL}/storage/v1${rel}`;
      });
    }
  }catch(e){}

  // Fecha en que se subió (o se actualizó por última vez) cada documento; los más recientes primero.
  docs.forEach(d => { d._fecha = fechaArchivo[d.storage_path] || d.uploaded_at || null; });
  docs.sort((a, b) => String(b._fecha || "").localeCompare(String(a._fecha || "")));

  cont.innerHTML = docs.map(d => {
    const url = firmados[d.storage_path];
    const fechaTxt = formatearFechaDoc(d._fecha);
    const nombre = TIPO_LABEL[d.tipo] || d.tipo;
    if (!url){
      return `<div class="doc-row"><span class="nombre">📄 <span>${esc(nombre)}${fechaTxt ? `<span class="doc-fecha">Subido el ${esc(fechaTxt)}</span>` : ""}</span></span><span class="vacio" style="padding:0;">No disponible</span></div>`;
    }
    const ext = EXT_POR_TIPO[tipoArchivo[d.storage_path]] || "pdf";
    const archivo = `${String(nombre).replace(/[^\wáéíóúñÁÉÍÓÚÑ ]+/g, "").trim().replace(/\s+/g, "_")}.${ext}`;
    const urlDescarga = `${url}${url.includes("?") ? "&" : "?"}download=${encodeURIComponent(archivo)}`;
    return `
      <div class="doc-row">
        <span class="nombre">📄 <span>${esc(nombre)}${fechaTxt ? `<span class="doc-fecha">Subido el ${esc(fechaTxt)}</span>` : ""}</span></span>
        <span class="doc-acciones">
          <a href="${esc(url)}" target="_blank" rel="noopener">Ver</a>
          <a href="${esc(urlDescarga)}" rel="noopener">Descargar</a>
        </span>
      </div>`;
  }).join("");
  docsPreparadosEn = Date.now();

  // Los enlaces vencen en 1 hora: se renuevan solos antes de eso.
  clearTimeout(docsTimer);
  docsTimer = setTimeout(() => { if (docsCedulaActual) cargarDocumentos(docsCedulaActual); }, 50 * 60 * 1000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && docsCedulaActual && sesion && Date.now() - docsPreparadosEn > 50 * 60 * 1000){
    cargarDocumentos(docsCedulaActual);
  }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const errEl = document.getElementById("loginErr");
  errEl.textContent = "";
  const escrito = document.getElementById("loginCedula").value.trim();
  if (escrito.includes("@")){
    errEl.innerHTML = 'Este portal es para clientes y se entra con la <b>cédula</b>. Si eres del equipo de trabajo, entra aquí: <a href="./" style="color:inherit;font-weight:700;">app del equipo</a>.';
    return;
  }
  const cedula = escrito.replace(/[^\d]/g, "");
  const password = document.getElementById("loginPass").value;
  if (!cedula || !password){ errEl.textContent = "Escribe tu cédula y tu contraseña."; return; }
  const btn = document.getElementById("loginBtn");
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const ok = await iniciarSesion(cedula, password);
    if (!ok){ errEl.textContent = "No se pudo entrar: revisa tu cédula y contraseña."; return; }
    document.getElementById("loginPass").value = "";
    mostrarApp();
    await cargarDatosCliente(cedula);
  }catch(e){
    errEl.textContent = "No se pudo conectar (" + e.message + "). Revisa tu internet e intenta de nuevo.";
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});
["loginCedula", "loginPass"].forEach(id =>
  document.getElementById(id).addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("loginBtn").click(); })
);

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await cerrarSesion();
  docsCedulaActual = null; clearTimeout(docsTimer);
  document.getElementById("resumenCont").innerHTML = `<div class="vacio">Cargando…</div>`;
  document.getElementById("historialCont").innerHTML = `<div class="vacio">Cargando…</div>`;
  document.getElementById("docsCont").innerHTML = `<div class="vacio">Cargando…</div>`;
  mostrarLogin();
});

// Arranque: el botón queda listo de inmediato; si ya había una sesión guardada, entra directo.
(async () => {
  const btn = document.getElementById("loginBtn");
  btn.disabled = false;
  btn.textContent = "Entrar";
  const guardada = leerSesionGuardada();
  if (guardada){
    sesion = guardada;
    mostrarApp();
    try{ await cargarDatosCliente(guardada.cedula); }
    catch(e){ mostrarErrorDatos("No se pudo conectar con el servidor. Revisa tu internet y recarga la página."); }
    return;
  }
  mostrarLogin();
})();
</script>
