<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROSEGUROSNET · Muelles y Seguros</title>
<meta name="theme-color" content="#1F3D70">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  App "Muelles y Seguros" (paso 2 · 17-nov-2026)
  Trabaja con la MISMA base de datos y el MISMO usuario que la app de Planillas (index.html).
  Paso 2: ya se pueden cambiar los MUELLES (aceptado/pendiente y fecha de vencimiento de cada muelle).
  Cómo guarda (igual que la app principal): solo envía las columnas aceptado_por_muelle y
  venc_por_muelle, y dentro de ellas solo el muelle que se cambió, sobre lo que hay en la nube en
  ese momento (así no pisa lo que otro compañero cambió). Nunca borra clientes ni toca pagos.
  Lo demás sigue siendo solo lectura. Los avisos por WhatsApp solo abren el chat con el mensaje listo.
-->
<style>
  :root{
    --azul:#1F3D70; --azul-2:#2A4E8A; --naranja:#E8590C; --naranja-osc:#C2410C;
    --fondo:#F4F6FA; --panel:#FFFFFF; --linea:#E3E8F1; --texto:#13213A; --suave:#52607A; --muted:#6B7891;
    --verde:#137A42; --verde-f:#E8F6EE; --rojo:#9B1C1C; --rojo-f:#FDECEC; --nar-f:#FFF4E5; --nar-t:#8A4B08; --azul-f:#E8EEF9; --gris-f:#EEF1F6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fondo:#0F1729; --panel:#17223A; --linea:#26324D; --texto:#E8EDF7; --suave:#AAB6CC; --muted:#8C99B2;
      --verde:#5FD394; --verde-f:#123524; --rojo:#F7A1A1; --rojo-f:#3A1717; --nar-f:#3A2A10; --nar-t:#FCD9A8; --azul-f:#1C2C4D; --gris-f:#212C44;
    }
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--fondo); color:var(--texto); font-family:Inter, system-ui, sans-serif; }
  button, input{ font-family:inherit; }
  a{ color:inherit; }
  .app{ display:flex; min-height:100vh; }
  .side{ width:244px; flex:0 0 244px; background:var(--azul); color:#fff; padding:18px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
  .brand .escudo{ width:34px; height:38px; background:#C8102E; border-radius:8px 8px 17px 17px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; }
  .brand b{ display:block; font-size:15px; letter-spacing:.02em; }
  .brand small{ color:#C9D6EE; font-size:12px; }
  .nav{ display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; min-height:44px; padding:0 12px; border:0; border-radius:10px; background:transparent; color:#DCE5F5; font-size:15px; font-weight:600; text-align:left; cursor:pointer; }
  .nav:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .nav.on{ background:rgba(255,255,255,.14); color:#fff; box-shadow:inset 3px 0 0 #F2803F; }
  .nav .badge{ background:var(--naranja); color:#fff; border-radius:999px; font-size:12px; font-weight:700; padding:2px 8px; }
  .side-pie{ margin-top:auto; border-top:1px solid rgba(255,255,255,.18); padding:12px 8px 0; display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .side-pie a{ color:#fff; font-weight:600; text-decoration:none; }
  .side-pie small{ color:#C9D6EE; }
  main{ flex:1; min-width:0; padding:22px 26px 40px; display:flex; flex-direction:column; gap:18px; }
  .top{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  .top h1{ margin:0; font-size:24px; font-weight:800; }
  .top p{ margin:2px 0 0; color:var(--suave); font-size:14px; }
  .buscar{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--linea); border-radius:10px; padding:0 12px; height:44px; min-width:min(320px, 100%); }
  .buscar input{ border:0; outline:none; background:transparent; color:var(--texto); font-size:15px; width:100%; }
  .aviso-lectura{ background:var(--azul-f); color:var(--azul); border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .aviso-lectura{ color:#C9D6EE; } }
  .kpis{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
  .kpi{ background:var(--panel); border:1px solid var(--linea); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .kpi span{ color:var(--suave); font-size:13px; font-weight:600; }
  .kpi b{ font-size:28px; font-weight:800; }
  .kpi small{ color:var(--muted); font-size:12px; }
  .fila2{ display:flex; flex-wrap:wrap; gap:18px; }
  .card{ background:var(--panel); border:1px solid var(--linea); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .card h2{ margin:0; font-size:17px; font-weight:800; }
  .card .sub{ margin:0; color:var(--suave); font-size:13px; }
  .card-h{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill-btn{ height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--linea); background:var(--panel); color:var(--texto); font-size:13px; font-weight:600; cursor:pointer; }
  .pill-btn.on{ background:var(--azul); color:#fff; border-color:var(--azul); }
  .tabla{ overflow-x:auto; }
  .t-fila{ display:grid; gap:10px; padding:10px; align-items:center; border-bottom:1px solid var(--linea); font-size:14px; min-width:620px; }
  .t-cab{ font-size:12px; font-weight:700; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; padding-top:6px; padding-bottom:8px; }
  .t-agenda{ grid-template-columns:2fr 1.3fr 1.1fr 1.1fr 128px; }
  .nombre{ font-weight:700; }
  .nombre-btn{ background:none; border:0; padding:0; text-align:left; cursor:pointer; color:var(--texto); display:flex; flex-direction:column; gap:2px; }
  .nombre-btn small, .detalle{ color:var(--muted); font-size:12px; font-weight:500; }
  .estado{ display:inline-block; justify-self:start; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
  .e-rojo{ background:var(--rojo-f); color:var(--rojo); } .e-nar{ background:var(--nar-f); color:var(--nar-t); }
  .e-verde{ background:var(--verde-f); color:var(--verde); } .e-azul{ background:var(--azul-f); color:var(--azul); } .e-gris{ background:var(--gris-f); color:var(--suave); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .e-azul{ color:#C9D6EE; } }
  .btn-wa{ height:36px; padding:0 12px; border-radius:9px; border:1px solid #1F9D55; background:var(--panel); color:var(--verde); font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; }
  .btn-wa[aria-disabled="true"]{ opacity:.45; pointer-events:none; }
  .btn-prim{ height:36px; padding:0 12px; border-radius:9px; border:0; background:var(--azul); color:#fff; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; }
  .opor{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; background:var(--nar-f); border-radius:10px; }
  .vacio{ color:var(--suave); font-size:14px; padding:14px; background:var(--gris-f); border-radius:10px; line-height:1.5; }
  .kanban{ display:grid; grid-template-columns:repeat(3, minmax(240px, 1fr)); gap:14px; overflow-x:auto; }
  .col{ background:var(--gris-f); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:240px; }
  .col-h{ display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:14px; padding:2px 4px; }
  .col-h span{ background:var(--panel); border-radius:999px; padding:2px 10px; font-size:12px; }
  .tarjeta{ background:var(--panel); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:6px; box-shadow:0 1px 2px rgba(19,33,58,.08); cursor:pointer; border:0; text-align:left; color:var(--texto); }
  .puntos{ display:flex; gap:6px; flex-wrap:wrap; }
  .punto{ font-size:12px; font-weight:700; border-radius:999px; padding:3px 9px; }
  .ficha-grid{ display:grid; grid-template-columns:1.2fr 2fr 1fr; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--linea); font-size:14px; }
  .login{ max-width:380px; margin:12vh auto; background:var(--panel); border:1px solid var(--linea); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:12px; }
  .login input{ height:44px; border:1px solid var(--linea); border-radius:10px; padding:0 12px; font-size:15px; background:var(--panel); color:var(--texto); }
  .login button{ height:44px; border:0; border-radius:10px; background:var(--naranja); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .err{ color:var(--rojo); font-size:13px; min-height:18px; }
  .menu-movil{ display:none; }
  .modal-fondo{ position:fixed; inset:0; background:rgba(10,20,40,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ background:var(--panel); border-radius:16px; width:min(520px, 100%); max-height:92vh; overflow:auto; padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .modal h2{ margin:0; font-size:19px; font-weight:800; }
  .m-fila{ display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; padding:12px; border:1px solid var(--linea); border-radius:12px; }
  .m-fila b{ font-size:15px; }
  .m-fila label{ grid-column:1 / -1; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--suave); font-weight:600; }
  .m-fila input[type=date]{ height:40px; border:1px solid var(--linea); border-radius:9px; padding:0 10px; font-size:14px; background:var(--panel); color:var(--texto); flex:1; }
  .toggle{ height:38px; min-width:120px; padding:0 14px; border-radius:999px; border:1px solid var(--linea); background:var(--gris-f); color:var(--suave); font-weight:700; font-size:13px; cursor:pointer; }
  .toggle.si{ background:var(--verde-f); color:var(--verde); border-color:#1F9D55; }
  .m-acciones{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .btn-sec{ height:40px; padding:0 14px; border-radius:9px; border:1px solid var(--linea); background:var(--panel); color:var(--texto); font-weight:700; font-size:14px; cursor:pointer; }
  .m-acciones .btn-prim{ height:40px; font-size:14px; background:var(--naranja); }
  .btn-prim:disabled{ opacity:.6; cursor:wait; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--texto); color:var(--panel); padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; z-index:60; max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  .m-input{ height:42px; border:1px solid var(--linea); border-radius:9px; padding:0 10px; font-size:14px; background:var(--panel); color:var(--texto); width:100%; }
  .f-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .f{ display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:700; color:var(--suave); }
  .modal{ width:min(620px, 100%); }
  .pol-fila{ display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--linea); flex-wrap:wrap; }
  .pol-acc{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .pol-acc .btn-sec, .pol-acc .btn-prim{ height:36px; font-size:13px; }
  @media (max-width: 560px){ .f-grid{ grid-template-columns:1fr; } }
  .tarjeta .editar{ align-self:flex-start; font-size:12px; font-weight:700; color:var(--naranja-osc); }
  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .side{ width:auto; flex:none; height:auto; position:static; flex-direction:row; flex-wrap:wrap; padding:10px; }
    .brand{ width:100%; padding-bottom:6px; }
    .nav{ width:auto; min-height:40px; font-size:14px; }
    .side-pie{ width:100%; margin-top:6px; }
    main{ padding:16px; }
    .kpis{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .ficha-grid{ grid-template-columns:1fr; gap:4px; }
  }
  /* ===== Estilo como la app de Planillas (encabezado blanco con línea roja y menú que se abre de lado) ===== */
  .app{ display:block; min-height:100vh; }
  .cab{ position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px max(16px, calc((100% - 1320px) / 2 + 20px)); background:var(--panel); border-bottom:3px solid #C8102E; }
  .cab-menu{ width:44px; height:44px; border:1px solid var(--linea); border-radius:10px; background:var(--panel); color:var(--texto); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cab-marca{ display:flex; align-items:center; gap:10px; }
  .cab-marca b{ display:block; font-size:18px; font-weight:800; letter-spacing:.02em; line-height:1.1; color:var(--texto); }
  .cab-marca small{ display:block; font-size:12px; color:var(--suave); }
  .cab-usuario{ display:flex; flex-direction:column; padding-left:12px; border-left:1px solid var(--linea); font-size:12.5px; color:var(--suave); line-height:1.35; }
  .cab-usuario b{ color:var(--texto); }
  .cab-der{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .cab-mes{ font-size:13px; font-weight:700; color:var(--azul); background:var(--azul-f); border-radius:999px; padding:6px 12px; }
  .usu-caja{ position:relative; }
  .usu-btn{ display:flex; align-items:center; gap:10px; min-height:44px; padding:4px 8px 4px 4px; border:0; border-radius:12px; background:transparent; cursor:pointer; color:var(--texto); text-align:left; }
  .usu-ini{ width:40px; height:40px; border-radius:50%; background:var(--azul); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .usu-txt{ display:flex; flex-direction:column; line-height:1.2; } .usu-txt b{ font-size:13.5px; white-space:nowrap; } .usu-txt small{ font-size:12px; color:var(--suave); }
  .usu-menu{ position:absolute; right:0; top:calc(100% + 6px); min-width:220px; background:var(--panel); border:1px solid var(--linea); border-radius:12px; box-shadow:0 12px 28px rgba(15,23,42,.18); padding:6px; z-index:80; display:flex; flex-direction:column; }
  .usu-menu[hidden]{ display:none; }
  .usu-menu a, .usu-menu button{ display:flex; align-items:center; min-height:42px; padding:0 12px; border:0; border-radius:8px; background:transparent; font-size:14px; color:var(--texto); text-decoration:none; cursor:pointer; text-align:left; }
  .usu-menu a:hover, .usu-menu button:hover{ background:var(--gris-f); }
  .usu-salir{ color:#B42318 !important; border-top:1px solid var(--linea) !important; border-radius:0 0 8px 8px !important; }
  .menu-velo{ position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:90; }
  .side{ position:fixed !important; top:0; left:0; bottom:0; width:340px !important; max-width:90vw; height:100vh !important; z-index:95; background:#FFFFFF !important; color:#13213A !important; padding:0 !important; gap:0 !important;
    box-shadow:8px 0 28px rgba(15,23,42,.25); transform:translateX(-105%); transition:transform .2s ease; visibility:hidden; overflow-y:auto; display:flex !important; flex-direction:column !important; flex-wrap:nowrap !important; }
  body.menu-abierto .side{ transform:none; visibility:visible; }
  .mc-cab{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:3px solid #C8102E; }
  .mc-cab b{ display:block; font-size:16px; font-weight:800; color:#1F3D70; } .mc-cab small{ display:block; font-size:11.5px; color:#52607A; }
  .mc-cerrar{ margin-left:auto; width:44px; height:44px; border:0; border-radius:10px; background:#EEF1F6; color:#13213A; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .side .nav{ display:flex !important; justify-content:flex-start !important; gap:12px; width:100% !important; min-height:52px; padding:0 16px !important; border:0 !important; border-bottom:1px solid #EEF1F6 !important; border-radius:0 !important; background:#FFFFFF !important; color:#13213A !important; font-size:15px !important; font-weight:500 !important; text-decoration:none; box-shadow:none !important; }
  .side .nav:hover{ background:#F2F5FA !important; }
  .side .nav[hidden], .usu-menu [hidden]{ display:none !important; }
  .side .nav.on{ background:#FFF4EC !important; font-weight:700 !important; box-shadow:inset 4px 0 0 #C8102E !important; }
  .nav-t{ flex:1; }
  .side .nav.nav-agregar{ font-weight:700 !important; color:#C8102E !important; background:#FFF4EC !important; }
  .btn-agregar-top{ height:44px !important; padding:0 16px !important; font-size:14px !important; background:var(--naranja) !important; }
  .mc-titulo{ padding:14px 16px 6px; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#6B7891; background:#F7F9FC; border-bottom:1px solid #EEF1F6; }
  main{ max-width:1320px; margin:0 auto; }
  @media (max-width: 860px){ .cab-usuario, .usu-txt{ display:none; } .cab{ position:static; } .side .nav{ width:100% !important; } }
</style>
</head>
<body>
<div id="pantallaLogin" class="login" hidden>
  <div class="brand" style="color:var(--texto)"><div class="escudo" style="color:#fff">P</div><div><b>PROSEGUROSNET</b><small style="color:var(--suave)">Muelles y Seguros</small></div></div>
  <p style="margin:0;color:var(--suave);font-size:14px">Entre con el mismo correo y clave de la app de Planillas.</p>
  <input id="lgEmail" type="email" placeholder="Correo" autocomplete="username" aria-label="Correo">
  <input id="lgPass" type="password" placeholder="Clave" autocomplete="current-password" aria-label="Clave">
  <button type="button" id="lgBtn">Entrar</button>
  <div class="err" id="lgErr"></div>
</div>

<div class="app" id="app" hidden>
  <header class="cab">
    <button type="button" class="cab-menu" id="menuAbrir" aria-label="Abrir el menú" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="cab-marca"><svg width="30" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 2 L58 12 V30 C58 46 47 57 32 62 C17 57 6 46 6 30 V12 Z" fill="#C8102E"/><path d="M20 30 l8 8 l16 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>PROSEGUROSNET</b><small>Muelles y Seguros</small></div></div>
    <div class="cab-usuario"><span>Usuario <b id="cabUsuario">—</b></span><span id="cabIngreso"></span></div>
    <div class="cab-der">
      <span class="cab-mes" id="pieMes"></span>
      <div class="usu-caja">
        <button type="button" class="usu-btn" id="usuBtn" aria-haspopup="menu" aria-expanded="false"><span class="usu-ini" id="usuIni">—</span><span class="usu-txt"><b id="usuNombre">—</b><small id="usuRol"></small></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="usu-menu" id="usuMenu" role="menu" hidden>
          <a role="menuitem" href="./">App de Planillas</a>
          <a role="menuitem" href="contabilidad.html" id="usuConta" hidden>App de Contabilidad</a>
          <button type="button" role="menuitem" id="usuSalir" class="usu-salir">Salir</button>
        </div>
      </div>
    </div>
  </header>
  <div class="menu-velo" id="menuVelo" hidden></div>
  <nav class="side" id="menuLado" aria-label="Menú">
    <div class="mc-cab"><svg width="30" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 2 L58 12 V30 C58 46 47 57 32 62 C17 57 6 46 6 30 V12 Z" fill="#C8102E"/><path d="M20 30 l8 8 l16 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>PROSEGUROSNET</b><small>Muelles y Seguros</small></div>

<script>
"use strict";
const SUPABASE_URL = "https://jjygarfwdmhzspqonvql.supabase.co";
const SUPABASE_KEY = "sb_publishable_QbM9pAw14n8SAu1aZr85-w_malVTs1s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const MUELLES = ["Sociedad", "TC Buen", "Agua Dulce"];
const EMPRESA_MUELLES = "actualización de muelles";
const DIAS_VENTANA = 30;

const D = { mes: null, clientes: [], polizas: [], responsables: new Map(), usuario: null, docs: [], envios: [], correosMuelles: {} };
let vista = "inicio", filtroAgenda = "toca", filtroMuelle = "", clienteSel = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const propio = (s) => String(s || "").toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase());
const fmt = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("es-CO");
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
function diasHasta(f){ if (!f) return null; const d = new Date(String(f).slice(0,10) + "T00:00:00"); if (isNaN(d)) return null; return Math.round((d - hoy0()) / 86400000); }
function fechaCorta(f){ if (!f) return ""; const d = new Date(String(f).slice(0,10) + "T00:00:00"); return d.toLocaleDateString("es-CO", { day:"numeric", month:"short", year:"numeric" }); }
function textoDias(d){ return d < 0 ? `vencido hace ${-d} día${d === -1 ? "" : "s"}` : d === 0 ? "vence hoy" : `en ${d} día${d === 1 ? "" : "s"}`; }
function claseDias(d){ return d < 0 ? "e-rojo" : d <= 7 ? "e-nar" : "e-azul"; }
const telValido = (t) => { const x = String(t || "").replace(/\D/g, ""); return /^3\d{9}$/.test(x) ? x : (/^573\d{9}$/.test(x) ? x.slice(2) : ""); };
function linkWa(tel, msg){ const t = telValido(tel); return t ? `https://wa.me/57${t}?text=${encodeURIComponent(msg)}` : ""; }

/* ---------- Datos ---------- */
async function cargar(){
  const { data: meses, error: e1 } = await sb.from("months").select("id,name,sort_order").order("sort_order", { ascending: false }).limit(1);
  if (e1) throw e1;
  D.mes = (meses || [])[0] || null;
  if (!D.mes){ D.clientes = []; return; }
  const cols = "id,ultima_edicion,cedula,nombre,empresa,responsable_grupo,estado_tramite,telefono,muelle,aceptado_por_muelle,venc_por_muelle,avisos_vencimiento,servicios_muelle,placa,venc_licencia,venc_soat,venc_tecno,venc_poliza,costo_servicio,valor_eps,valor_arl,valor_pension,valor_caja";
  const [cl, po, re] = await Promise.all([
    sb.from("clients").select(cols).eq("month_id", D.mes.id).order("row_no"),
    sb.from("polizas").select("*").order("fecha_vencimiento", { ascending: true }),
    sb.from("responsables").select("nombre,clave,telefono")
  ]);
  if (cl.error) throw cl.error;
  D.clientes = cl.data || [];
  D.polizas = po.error ? [] : (po.data || []);
  D.responsables = new Map((re.data || []).map(r => [norm(r.clave || r.nombre), r]));
  await cargarDocsMuelles();
  await cargarEnviosMuelle();
}
// A quién se le escribe: si tiene responsable (persona) con teléfono, a él; si no, al cliente
function telDestino(c){
  const resp = norm(c.responsable_grupo);
  if (resp && resp !== "independiente" && resp !== "independientes"){
    const r = D.responsables.get(resp);
    if (r && telValido(r.telefono)) return r.telefono;
  }
  return c.telefono;
}
const esServicioMuelle = (c) => norm(c.empresa) === norm(EMPRESA_MUELLES);
const tieneMuelle = (c) => !!String(c.muelle || "").trim() || esServicioMuelle(c);
// Personas de muelles que solo vinieron por enrolamiento o un curso (sin actualización): no van en el tablero de Muelles
const soloOtrosServicios = (c) => { const sv = c.servicios_muelle; if (!esServicioMuelle(c) || !sv || typeof sv !== "object") return false; const ks = Object.keys(sv).filter(k => !k.startsWith("_")); return ks.length > 0 && !ks.some(k => k.startsWith("act:") || k === "actualizacion"); };
const enTableroMuelles = (c) => tieneMuelle(c) && !soloOtrosServicios(c);

/* Todo lo que vence (muelles, SOAT, licencia, tecnomecánica, pólizas).
   avisado = fecha del último aviso por WhatsApp para ESA fecha de vencimiento. */
// VENTA DE SOAT EN PAUSA (17-nov-2026, lo pidió Nestor): no se borra nada; para reactivarla poner false.
// En pausa se esconden «Registrar SOAT vendido», «Vendí», las oportunidades de venta de SOAT y la opción SOAT al registrar una venta.
// Los SOAT ya guardados, las fechas del vehículo y sus avisos siguen funcionando.
var VENTA_SOAT_EN_PAUSA = true;
const POL_TIPOS = ["SOAT", "Todo riesgo vehículo", "Responsabilidad civil", "Póliza de muelles", "Hogar", "Vida", "Accidentes personales", "Cumplimiento", "Otro"];
const ETAPAS = [20, 7, 1]; // días antes del vencimiento en que se avisa
const polActiva = (p) => (p.estado || "activa") === "activa";
function vencimientos(){
  const out = [];
  const soatPoliza = new Set(D.polizas.filter(p => polActiva(p) && p.tipo === "SOAT" && p.cedula).map(p => String(p.cedula)));
  D.clientes.forEach(c => {
    const av = c.avisos_vencimiento || {};
    const add = (que, tipo, k, fecha) => {
      const d = diasHasta(fecha); if (d === null) return;
      const a = av[k]; out.push({ c, que, tipo, k, fecha: String(fecha).slice(0, 10), dias: d, avisado: a && a.venc === String(fecha).slice(0, 10) ? a.enviado : "" });
    };
    Object.entries(c.venc_por_muelle || {}).forEach(([m, f]) => add(`Actualización ${m}`, "muelle", "muelle:" + m, f));
    if (!soatPoliza.has(String(c.cedula))) add("SOAT", "soat", "soat", c.venc_soat);
    add("Licencia de conducción", "licencia", "licencia", c.venc_licencia);
    add("Tecnomecánica", "tecno", "tecno", c.venc_tecno);
    add("Póliza del vehículo", "poliza", "poliza", c.venc_poliza);
  });
  D.polizas.filter(polActiva).forEach(p => {
    const d = diasHasta(p.fecha_vencimiento);
    if (d === null) return;
    const c = D.clientes.find(x => String(x.cedula) === String(p.cedula)) || { nombre: p.nombre, cedula: p.cedula, telefono: p.telefono, placa: p.placa };
    out.push({ c, que: p.tipo === "SOAT" ? "SOAT" : `Póliza ${p.tipo || ""}`.trim(), tipo: p.tipo === "SOAT" ? "soat" : "poliza", fecha: String(p.fecha_vencimiento).slice(0, 10), dias: d, poliza: p, avisado: p.avisado_el || "" });
  });
  return out.sort((a, b) => a.dias - b.dias);
}
// En qué aviso va: 20, 7 o 1 día antes; -1 = ya vencido (hasta 60 días después)
function etapa(x){ const d = x.dias; if (d < -60 || d > ETAPAS[0]) return null; if (d < 0) return -1; return d <= 1 ? 1 : d <= 7 ? 7 : 20; }
// Le toca aviso si está en una etapa y no se le ha avisado en esa etapa
function tocaAviso(x){
  const s = etapa(x); if (s === null) return false;
  if (!x.avisado) return true;
  const diasAlAvisar = Math.round((new Date(x.fecha + "T00:00:00") - new Date(String(x.avisado).slice(0, 10) + "T00:00:00")) / 86400000);
  return diasAlAvisar > s;
}
function telDeItem(x){ return x.poliza && telValido(x.poliza.telefono) && !D.clientes.some(c => String(c.cedula) === String(x.poliza.cedula)) ? x.poliza.telefono : telDestino(x.c); }
function mensajeVence(v){
  const nombre = propio(v.c.nombre).split(" ")[0] || "";
  const placaTxt = (v.poliza && v.poliza.placa) || v.c.placa;
  const placa = placaTxt ? ` del vehículo de placa *${String(placaTxt).toUpperCase()}*` : "";
  const cuando = v.dias < 0 ? `venció el *${fechaCorta(v.fecha)}*` : `vence el *${fechaCorta(v.fecha)}*${v.dias <= 7 ? (v.dias === 0 ? " (hoy)" : ` (en ${v.dias} día${v.dias === 1 ? "" : "s"})`) : ""}`;
  const aseg = v.poliza && v.poliza.aseguradora ? ` con ${v.poliza.aseguradora}` : "";
  const que = v.tipo === "muelle" ? "la " + v.que.toLowerCase() : "su *" + v.que + "*" + (v.tipo === "soat" || v.tipo === "tecno" || v.tipo === "poliza" ? placa : "") + aseg;
  const cierre = v.tipo === "muelle"
    ? (v.dias < 0 ? "Sin la actualización al día no le permiten el ingreso al muelle. " : "Le avisamos con tiempo para que no le quiten el ingreso al muelle. ")
    : (v.dias < 0 ? (v.tipo === "soat" || v.tipo === "tecno" ? "Circular con documentos vencidos puede traerle multas e inmovilización. " : "Mientras esté vencida no tiene cobertura. ") : "Le avisamos con tiempo para que no le coja la fecha. ");
  return `🛡️ *PROSEGUROSNET*\n¡Hola, ${nombre}! 👋\n\nLe recordamos que ${que} ${cuando}.\n\n${cierre}En PROSEGUROSNET se lo ${v.tipo === "muelle" ? "actualizamos" : "renovamos"} rápido y sin filas.\n\n¿Le ayudamos? Responda este mensaje. ✅\nprosnet.co`;
}

/* ---------- Pantallas ---------- */
const TITULOS = {
  inicio: ["Hoy", VENTA_SOAT_EN_PAUSA ? "A quién avisar hoy" : "A quién avisar hoy y lo que se puede vender"],
  muelles: ["Muelles", "Actualización de muelles"],
  enrol: ["Enrolamientos", "Personas que vienen a enrolarse (una sola vez)"],

  soat: ["SOAT y vehículos", "SOAT, licencia y tecnomecánica de los clientes"],
  polizas: ["Pólizas", "Ventas de SOAT y pólizas, renovaciones y comisiones"],

};
let LISTA_AGENDA = [];
function render(){
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("on", b.dataset.vista === vista));
  $("titulo").textContent = TITULOS[vista][0];
  $("subtitulo").textContent = TITULOS[vista][1];

  const v = vencimientos();
  LISTA_AGENDA = v;
  const toca = v.filter(tocaAviso).length;
  const bI = $("bInicio"); bI.hidden = !toca; bI.textContent = toca;
  const pendMuelle = D.clientes.filter(c => enTableroMuelles(c) && MUELLES.some(m => !(c.aceptado_por_muelle || {})[m])).length;
  const bM = $("bMuelles"); bM.hidden = !pendMuelle; bM.textContent = pendMuelle;
  const soatToca = v.filter(x => (x.tipo === "soat" || x.tipo === "licencia" || x.tipo === "tecno") && tocaAviso(x)).length;
  const bS = $("bSoat"); bS.hidden = !soatToca; bS.textContent = soatToca;
  const polToca = v.filter(x => x.poliza && x.tipo === "poliza" && tocaAviso(x)).length;
  const bP = $("bPolizas"); bP.hidden = !polToca; bP.textContent = polToca;
  const nEnrol = D.clientes.filter(c => tieneServicio(c, "enrolamiento") && !enrolado(c)).length;
  const bE = $("bEnrol"); bE.hidden = !nEnrol; bE.textContent = nEnrol;
  const nOpc = D.clientes.filter(c => serviciosOpcionales(c).length && !pagado(c)).length;
  const bO = $("bOpc"); bO.hidden = !nOpc; bO.textContent = nOpc;

  else c.innerHTML = vistaCliente();
}

function botonAviso(x){
  const i = LISTA_AGENDA.indexOf(x), tel = telValido(telDeItem(x));
  if (!tel) return `<span class="detalle" title="Sin teléfono">Sin teléfono</span>`;
  if (tocaAviso(x)) return `<button type="button" class="btn-wa" style="background:#1F9D55;color:#fff;border-color:#1F9D55" data-avisar="${i}" title="${etapa(x) > 0 ? `Aviso de ${etapa(x)} día${etapa(x) === 1 ? "" : "s"} antes` : "Ya venció"}">Avisar${etapa(x) > 0 ? ` · ${etapa(x)} d` : ""}</button>`;
  return `<button type="button" class="btn-wa" data-avisar="${i}" title="${x.avisado ? "Avisado el " + esc(fechaCorta(x.avisado)) + ". Toque para volver a avisar." : "Abrir WhatsApp"}">${x.avisado ? "✓ " + esc(new Date(String(x.avisado).slice(0, 10) + "T00:00:00").toLocaleDateString("es-CO", { day: "numeric", month: "short" })) : "WhatsApp"}</button>`;
}
function filaAgenda(x){
  return `<div class="t-fila t-agenda">
    <button type="button" class="nombre-btn" data-ficha="${esc(x.c.cedula)}"><span class="nombre">${esc(propio(x.c.nombre))}</span><small>${esc([((x.poliza && x.poliza.placa) || x.c.placa) ? String((x.poliza && x.poliza.placa) || x.c.placa).toUpperCase() : "", x.c.responsable_grupo ? "Resp.: " + propio(x.c.responsable_grupo) : ""].filter(Boolean).join(" · ") || "CC " + (x.c.cedula || ""))}</small></button>
    <span>${esc(x.que)}</span>
    <span style="font-weight:600">${esc(fechaCorta(x.fecha))}</span>
    <span class="estado ${claseDias(x.dias)}">${esc(textoDias(x.dias))}</span>
    ${botonAviso(x)}
  </div>`;
}
const mesISO = () => new Date().toISOString().slice(0, 7);
const comisionesMes = () => D.polizas.filter(p => p.estado !== "cancelada" && String(p.fecha_inicio || "").slice(0, 7) === mesISO());
function vistaInicio(v){
  const toca = v.filter(tocaAviso), vencidos = v.filter(x => x.dias < 0 && x.dias >= -60).length;
  const conMuelle = D.clientes.filter(tieneMuelle);
  const pendientes = conMuelle.filter(c => MUELLES.some(m => !(c.aceptado_por_muelle || {})[m])).length;
  const soatCed = new Set(D.polizas.filter(p => polActiva(p) && p.tipo === "SOAT").map(p => String(p.cedula)));
  const sinSoat = D.clientes.filter(c => tieneMuelle(c) && !c.venc_soat && !soatCed.has(String(c.cedula)));
  const cm = comisionesMes();
  const filtrado = v.filter(x => filtroAgenda === "toca" ? tocaAviso(x) : filtroAgenda === "todos" ? x.dias <= 60 && x.dias >= -60 : filtroAgenda === "vencidos" ? x.dias < 0 && x.dias >= -60 : filtroAgenda === "semana" ? x.dias >= 0 && x.dias <= 7 : x.dias >= 0 && x.dias <= DIAS_VENTANA);
  const pills = [["toca",`Toca avisar (${toca.length})`],["vencidos","Vencidos"],["semana","Esta semana"],["mes","Este mes"],["todos","Próximos 60 días"]]
    .map(([k, t]) => `<button type="button" class="pill-btn ${filtroAgenda === k ? "on" : ""}" data-filtro="${k}">${t}</button>`).join("");
  return `
  <div class="kpis">
    <div class="kpi"><span>Toca avisar hoy</span><b style="color:var(--naranja-osc)">${toca.length}</b><small>Avisos de 20, 7 y 1 día, y vencidos</small></div>
    <div class="kpi"><span>Ya vencidos</span><b style="color:var(--rojo)">${vencidos}</b><small>Oportunidad de renovar</small></div>
    <div class="kpi"><span>Clientes con muelle</span><b>${conMuelle.length}</b><small>${pendientes} con algún muelle pendiente</small></div>
    <div class="kpi"><span>Comisiones de ${new Date().toLocaleDateString("es-CO", { month: "long" })}</span><b style="color:var(--verde)">${fmt(cm.reduce((a, p) => a + Number(p.comision || 0), 0))}</b><small>${cm.length} venta${cm.length === 1 ? "" : "s"} de SOAT y pólizas</small></div>
  </div>
  <div class="fila2">
    <section class="card" style="flex:3 1 520px">
      <div class="card-h"><h2>Agenda de vencimientos</h2><div class="pills">${pills}</div></div>
      <div class="tabla">
        <div class="t-fila t-agenda t-cab"><span>Cliente</span><span>Qué vence</span><span>Fecha</span><span>Estado</span><span>Aviso</span></div>

      </div>

    </section>
    ${VENTA_SOAT_EN_PAUSA ? "" : `<section class="card" style="flex:2 1 300px">
      <h2>Oportunidades de venta</h2>

async function marcarEnrolado(id){

}

/* ---------- Envío de planilla y comprobante a un muelle por correo (ej. Agua Dulce) ----------

   Se anota en «envios_muelle»; la respuesta (aprobado/rechazado) la lee la tarea «Correo a la app»
   con registrar_respuesta_muelle, que marca el muelle como aceptado. */
async function cargarEnviosMuelle(){
  try{
    const [cf, en] = await Promise.all([
      sb.from("configuracion").select("valor").eq("clave", "correos_muelles").maybeSingle(),
      sb.from("envios_muelle").select("*").eq("month_id", D.mes.id)
    ]);

    D.envios = en.error ? [] : (en.data || []);

}

  return e.estado === "aprobado" ? `<small style="color:var(--verde);font-weight:700">✅ Aprobado por correo ${esc(f)}</small>`
    : e.estado === "rechazado" ? `<small style="color:#B42318;font-weight:700" title="${esc(e.respuesta || "")}">⚠️ Respondieron con novedad ${esc(f)}: ${esc(String(e.respuesta || "").slice(0, 90))}</small>`

// Modo a mano: baja el PDF y abre Gmail para adjuntarlo
async function enviarAMano(id, m){
  const c = D.clientes.find(x => String(x.id) === String(id)); const cfg = D.correosMuelles[m];
  if (!c || !cfg) return;
  const mes = mesISOActual();
  const pedidos = [["planilla_pagada", "Planilla pagada"], ["comprobante_pago", "Comprobante de pago"]];
  const faltan = pedidos.filter(([k]) => !docDe(c.cedula, k, mes)).map(([, n]) => n);
  if (faltan.length){
    toast(`Falta subir: ${faltan.join(" y ")} de ${D.mes.name}. Súbalos en «📎 Documentos» y vuelva a intentar.`);
    abrirDocs(c.id); return;
  }
  const nombre = propio(c.nombre), ced = String(c.cedula);
  const servicio = (c.servicios_muelle && "enrolamiento" in c.servicios_muelle) ? "enrolamiento" : "actualización";
  const sinTildes = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
  const archivo = `${sinTildes(m)}_${sinTildes(nombre)}_${ced}.pdf`;
  toast("Armando el PDF…");
  try{
    const JsPDF = await cargarJsPDF();
    const pdf = new JsPDF({ unit: "pt", format: "letter" });
    let primera = true;
    for (const [k, n] of pedidos){ const cv = await imagenDeRuta(docDe(c.cedula, k, mes).storage_path); agregarAlPDF(pdf, cv, `${n} · ${nombre} · CC ${ced}`, primera); primera = false; }
    pdf.save(archivo);
  }catch(err){ console.error(err); toast("No se pudo armar el PDF (revise el internet). No se envió nada."); return; }
  const asunto = `${servicio === "enrolamiento" ? "Enrolamiento" : "Actualización"} · CC ${ced} · ${nombre}`;
  const hora = new Date().getHours(), saludo = hora < 12 ? "Buenos días" : hora < 19 ? "Buenas tardes" : "Buenas noches";
  const cuerpo = `${saludo}, por favor ${servicio === "enrolamiento" ? "enrolar" : "actualizar"} a ${nombre}, CC ${ced}. Adjunto documentos.\n\nGracias.\nPROSEGUROSNET`;
  const url = `https://mail.google.com/mail/?${cfg.desde ? "authuser=" + encodeURIComponent(cfg.desde) + "&" : ""}view=cm&fs=1&to=${encodeURIComponent(cfg.para)}&su=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
  window.open(url, "_blank", "noopener");
  try{
    const fila = { month_id: D.mes.id, cedula: ced, nombre: c.nombre, muelle: m, correo: cfg.para, enviado_at: new Date().toISOString(), estado: "enviado", respuesta: null, respuesta_at: null };
    const { error } = await sb.from("envios_muelle").upsert(fila, { onConflict: "month_id,cedula,muelle" });
    if (error) throw error;
    await cargarEnviosMuelle();
  }catch(err){ console.error(err); }
  toast(`✅ PDF descargado (${archivo}). En el correo que se abrió, adjúntelo y toque Enviar.`);
  if (edicion) pintarEditor(); else render();
}
document.addEventListener("click", (e) => {

// Guarda SOLO lo que cambió, sobre lo que hay en la nube en este momento
async function guardarMuelles(){
  const c = D.clientes.find(x => x.id === edicion.id); if (!c) return;
  const antesAc = c.aceptado_por_muelle || {}, antesV = c.venc_por_muelle || {};
  const cambiosAc = {}, cambiosV = {};
  MUELLES.forEach(m => {
    if (!!edicion.ac[m] !== !!antesAc[m]) cambiosAc[m] = !!edicion.ac[m];
    const nv = String(edicion.vpm[m] || ""), av = String(antesV[m] || "");
    if (nv !== av) cambiosV[m] = nv;
  });
  if (!Object.keys(cambiosAc).length && !Object.keys(cambiosV).length){ cerrarEditor(); toast("No hubo cambios."); return; }
  const btn = document.querySelector("[data-m-guardar]"); if (btn){ btn.disabled = true; btn.textContent = "Guardando…"; }
  try{
    const { data: fila, error: e1 } = await sb.from("clients").select("id,aceptado_por_muelle,venc_por_muelle").eq("id", c.id).single();
    if (e1) throw e1;
    const ac = { ...(fila.aceptado_por_muelle || {}), ...cambiosAc };
    const vpm = { ...(fila.venc_por_muelle || {}) };
    Object.entries(cambiosV).forEach(([m, f]) => { if (f) vpm[m] = f; else delete vpm[m]; });
    const ahora = new Date().toISOString();
    const upd = { aceptado_por_muelle: ac, venc_por_muelle: vpm, updated_at: ahora, ultima_edicion: ahora };
    if (D.usuario) upd.updated_by = D.usuario;
    const { data: nueva, error: e2 } = await sb.from("clients").update(upd).eq("id", c.id).select("id,aceptado_por_muelle,venc_por_muelle,ultima_edicion").single();
    if (e2) throw e2;
    Object.assign(c, nueva);
    cerrarEditor(); render();
    toast(`✅ Muelles de ${propio(c.nombre).split(" ")[0]} guardados.`);
  }catch(err){
    if (btn){ btn.disabled = false; btn.textContent = "Guardar"; }
    toast("No se pudo guardar (revise el internet). No se cambió nada.");
    console.error(err);
  }
}
$("modalMuelles").addEventListener("click", (e) => {
  if (e.target.id === "modalMuelles" || e.target.closest("[data-m-cancelar]")){ cerrarEditor(); return; }

function escucharCambios(){
  if (!D.mes || canalVivo) return;

    .on("postgres_changes", { event: "*", schema: "public", table: "clients", filter: `month_id=eq.${D.mes.id}` }, (p) => {

/* ---------- Avisos, ventas de SOAT/pólizas y vehículo (paso 3) ----------
   Pólizas: tabla "polizas" (la misma de la app de Planillas; la comisión entra sola a sus ingresos del mes).

   Avisos de vehículo y muelles: en clients.avisos_vencimiento (mismo formato que la app de Planillas). */
let filtroVeh = "", filtroPol = "";
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function masUnAnio(iso){ const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ""; const d = new Date(+m[1] + 1, +m[2] - 1, +m[3]); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
async function avisar(i){

      if (e1) throw e1;
      const av = { ...((fila && fila.avisos_vencimiento) || {}), [x.k]: { venc: x.fecha, enviado: hoy } };

      const upd = { avisos_vencimiento: av, updated_at: ahora, ultima_edicion: ahora }; if (D.usuario) upd.updated_by = D.usuario;
      const { error } = await sb.from("clients").update(upd).eq("id", x.c.id);
      if (error) throw error;
      x.c.avisos_vencimiento = av;

async function guardarPoliza(){
  const v = (id) => ($(id) ? $(id).value.trim() : "");
  const err = (m) => { $("pErr").textContent = m; };
  const nombre = v("pNombre").replace(/\s+/g, " ");
  if (!nombre) return err("Escriba el nombre de la persona.");
  if (!v("pVence")) return err("Escriba la fecha de vencimiento: con ella la app avisa a tiempo.");
  if (v("pIni") && v("pVence") < v("pIni")) return err("La fecha de vencimiento no puede ser antes del inicio.");
  const tel = v("pTel").replace(/\D/g, "").replace(/^57(?=3\d{9}$)/, "");
  if (tel && tel.length !== 10) return err("El teléfono debe tener 10 dígitos.");
  const prima = Math.round(Number(v("pPrima")) || 0), com = Math.round(Number(v("pCom")) || 0);
  if (com > prima && prima > 0 && !confirm("Lo que le deja es mayor que el valor de la póliza. ¿Guardar así?")) return;
  const fila = { cedula: v("pCedula").replace(/\D/g, "") || null, nombre: nombre.toLowerCase(), telefono: tel || null, tipo: v("pTipo"), aseguradora: v("pAseg").replace(/\s+/g, " ") || null,
    numero_poliza: v("pNum") || null, placa: v("pPlaca").toUpperCase().replace(/\s+/g, "") || null, fecha_inicio: v("pIni") || null, fecha_vencimiento: v("pVence"),
    valor_prima: prima, comision: com, nota: v("pNota") || null, updated_at: new Date().toISOString() };
  const b = $("pGuardar"); b.disabled = true; b.textContent = "Guardando…";
  let r;
  if (polEdit){
    fila.estado = v("pEstado") || "activa";
    if (String(polEdit.fecha_vencimiento || "").slice(0, 10) !== fila.fecha_vencimiento) fila.avisado_el = null;
    r = await sb.from("polizas").update(fila).eq("id", polEdit.id);
  } else {
    r = await sb.from("polizas").insert(fila);
    if (!r.error && polRenov) await sb.from("polizas").update({ estado: "renovada", updated_at: new Date().toISOString() }).eq("id", polRenov.id);
  }
  if (r.error){ b.disabled = false; b.textContent = "Guardar"; return err("No se pudo guardar: " + r.error.message); }
  const eraRenov = !!polRenov, eraNueva = !polEdit;
  // SOAT de un cliente: también se le pone la fecha y la placa en su ficha (solo si cambian), para que la app de Planillas lo vea
  if (fila.tipo === "SOAT" && fila.cedula && (eraNueva || fila.estado === "activa")){
    const c = D.clientes.find(x => String(x.cedula) === fila.cedula);
    if (c && c.id){
      const cambios = {};
      if (String(c.venc_soat || "").slice(0, 10) !== fila.fecha_vencimiento) cambios.venc_soat = fila.fecha_vencimiento;
      if (fila.placa && !c.placa) cambios.placa = fila.placa;
      if (Object.keys(cambios).length) await guardarCliente(c, cambios).catch(e => console.error(e));
    }
  }
  await recargarPolizas(); cerrarModal2(); render();
  toast(eraRenov ? "✅ Renovación guardada. La anterior quedó como renovada." : eraNueva ? `✅ Venta registrada. Le deja ${fmt(fila.comision)} (pasa a Contabilidad).` : "✅ Guardado.");
}

async function subirArchivoPoliza(archivo){

  $("pArchEst").textContent = "Subiendo…";
  const { error } = await sb.storage.from("documentos-clientes").upload(ruta, archivo, { upsert: true, contentType: archivo.type || "application/octet-stream" });
  if (error){ $("pArchEst").textContent = "No se pudo subir: " + error.message; return; }
  const r = await sb.from("polizas").update({ archivo_path: ruta, updated_at: new Date().toISOString() }).eq("id", polEdit.id);
  if (r.error){ $("pArchEst").textContent = "Subió, pero no se pudo anotar: " + r.error.message; return; }
  polEdit.archivo_path = ruta; $("pArchEst").textContent = "✅ Póliza guardada.";
}
async function verArchivoPoliza(p){

async function guardarAgregar(){
  const err = (m) => { $("aErr").textContent = m; };
  const ced = $("aCedula").value.replace(/\D/g, "");
  const nombre = $("aNombre").value.trim().replace(/\s+/g, " ").toLowerCase();
  const tel = $("aTel").value.replace(/\D/g, "").replace(/^57(?=3\d{9}$)/, "");
  if (ced.length < 6 || ced.length > 12) return err("La cédula debe tener entre 6 y 12 números.");
  if (!nombre) return err("Escriba el nombre.");
  if (tel.length !== 10) return err(`El teléfono debe tener 10 dígitos (tiene ${tel.length}).`);
  const { sv, tot } = totalServiciosForm();
  if (!Object.keys(sv).length) return err("Marque al menos un servicio.");
  if (Object.values(sv).some(v => !v)) return err("Escriba el valor de cada servicio marcado.");
  if ("curso" in sv){ const tipo = $("aCursoTipo").value.trim(); if (!tipo) return err("Escriba qué curso es."); sv._cursoTipo = tipo; }
  const b = $("aGuardar"); b.disabled = true; b.textContent = "Revisando…";
  try{
    // 1) nunca repetir: se vuelve a buscar en la nube justo antes de guardar
    const f = await buscarCedulaEnMes(ced);
    if (f){ agregarExistente = f; b.disabled = false; b.textContent = "Guardar"; await revisarCedulaAgregar(); return err("Esa cédula ya existe este mes: no se creó otra. Use el botón de arriba."); }
    // 2) número siguiente de la lista del mes
    const { data: ult } = await sb.from("clients").select("row_no").eq("month_id", D.mes.id).order("row_no", { ascending: false, nullsFirst: false }).limit(1);

/* Imagen liviana: fotos a máx. 1600 px en JPEG; un PDF se pasa a imagen (hasta 6 páginas, una debajo de otra). */
const PDFJS_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.min.mjs";
const PDFJS_WORKER_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.worker.min.mjs";
const JSPDF_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
let _pdfjs = null, _jspdf = null;
async function lectorPDF(){ if (_pdfjs) return _pdfjs; const m = await import(PDFJS_URL); m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL; _pdfjs = m; return m; }
function cargarJsPDF(){
  if (_jspdf) return Promise.resolve(_jspdf);
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = JSPDF_URL; s.onload = () => { _jspdf = window.jspdf.jsPDF; ok(_jspdf); }; s.onerror = () => mal(new Error("Sin internet para crear el PDF")); document.head.appendChild(s); });
}
const lienzoABlob = (cv, q) => new Promise(ok => cv.toBlob(ok, "image/jpeg", q || 0.75));
async function paginasPDFaLienzo(datos){
  const pdfjs = await lectorPDF();
  const pdf = await pdfjs.getDocument({ data: datos }).promise;
  const lienzos = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 6); i++){
    const pg = await pdf.getPage(i), base = pg.getViewport({ scale: 1 });
    const vista = pg.getViewport({ scale: Math.min(3, 1400 / base.width) });
    const cv = document.createElement("canvas"); cv.width = Math.round(vista.width); cv.height = Math.round(vista.height);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
    await pg.render({ canvasContext: cx, viewport: vista }).promise; lienzos.push(cv);
  }
  const total = document.createElement("canvas");
  total.width = Math.max(...lienzos.map(x => x.width)); total.height = lienzos.reduce((a, x) => a + x.height, 0) + 16 * (lienzos.length - 1);
  const tc = total.getContext("2d"); tc.fillStyle = "#fff"; tc.fillRect(0, 0, total.width, total.height);
  let y = 0; lienzos.forEach(x => { tc.drawImage(x, 0, y); y += x.height + 16; });
  return total;
}
async function aImagenLiviana(archivo){
  if (/pdf/i.test(archivo.type) || /\.pdf$/i.test(archivo.name || "")){
    return lienzoABlob(await paginasPDFaLienzo(new Uint8Array(await archivo.arrayBuffer())), 0.72);
  }
  const bmp = await createImageBitmap(archivo);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
  return lienzoABlob(cv, 0.75);
}
// Trae un documento guardado como imagen (si se guardó como PDF desde la app de Planillas, se pasa a imagen)
async function imagenDeRuta(ruta){
  const { data, error } = await sb.storage.from("documentos-clientes").download(ruta);
  if (error || !data) throw error || new Error("no se pudo traer");
  const buf = new Uint8Array(await data.arrayBuffer());
  const esPdf = buf[0] === 0x25 && buf[1] === 0x50 && buf[2] === 0x44 && buf[3] === 0x46;
  const cv = esPdf ? await paginasPDFaLienzo(buf) : await (async () => { const bmp = await createImageBitmap(new Blob([buf])); const x = document.createElement("canvas"); x.width = bmp.width; x.height = bmp.height; const g = x.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, x.width, x.height); g.drawImage(bmp, 0, 0); return x; })();
  return cv;
}
// Agrega una imagen al PDF en hojas carta, ajustada al ancho (si es muy alta sigue en la hoja siguiente)
function agregarAlPDF(pdf, cv, titulo, primera){
  const W = 612, H = 792, M = 36, anchoUtil = W - 2 * M;
  const escala = anchoUtil / cv.width, altoPorHoja = (H - 2 * M - 24) / escala;
  for (let y = 0; y < cv.height; y += altoPorHoja){
    if (!(primera && y === 0)) pdf.addPage("letter", "portrait");
    const h = Math.min(altoPorHoja, cv.height - y);
    const trozo = document.createElement("canvas"); trozo.width = cv.width; trozo.height = Math.ceil(h);
    trozo.getContext("2d").drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
    pdf.setFontSize(11); pdf.text(titulo + (y > 0 ? " (continúa)" : ""), M, M + 8);
    pdf.addImage(trozo.toDataURL("image/jpeg", 0.8), "JPEG", M, M + 20, anchoUtil, h * escala);
  }
}
async function descargarPDF(rutas, nombreArchivo){
  $("dErr").textContent = "Armando el PDF…";
  try{
    const JsPDF = await cargarJsPDF();
    const pdf = new JsPDF({ unit: "pt", format: "letter" });
    let primera = true;
    for (const [ruta, titulo] of rutas){
      const cv = await imagenDeRuta(ruta);
      agregarAlPDF(pdf, cv, titulo, primera); primera = false;
    }
    pdf.save(nombreArchivo);
    $("dErr").textContent = "";
  }catch(err){ console.error(err); $("dErr").textContent = "No se pudo crear el PDF (revise el internet)."; }
}

}

    escucharCambios();
    $("pantallaLogin").hidden = true; $("app").hidden = false;
    // Abrir directo a un cliente: seguros.html?cedula=123
    const ced = new URLSearchParams(location.search).get("cedula");
    if (ced){ clienteSel = ced; vista = "cliente"; }
    render();
  }catch(err){
    $("pantallaLogin").hidden = false; $("app").hidden = true;
    $("lgErr").textContent = "No se pudieron cargar los datos: " + (err.message || err);
  }
}
$("lgBtn").addEventListener("click", async () => {
  $("lgErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("lgEmail").value.trim(), password: $("lgPass").value });
  if (error){ $("lgErr").textContent = "Correo o clave incorrectos."; return; }
  entrar();
});
$("lgPass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("lgBtn").click(); });
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) entrar(); else $("pantallaLogin").hidden = false;
})();
</script>
</body>
</html>
